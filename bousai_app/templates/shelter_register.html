{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <p role="status">{{ message }}</p>
{% endif %}

{% if error %}
  <p role="alert">{{ message }}</p>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name" required>
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
